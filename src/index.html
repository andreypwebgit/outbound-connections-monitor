<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outbound Connections Monitor</title>
  <link href="./css/output.css" rel="stylesheet">
  <script type="module" src="./js/app.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-6 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center pb-4 border-b border-gray-700">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Outbound Connections Monitor</h1>
        <p class="text-gray-400 text-sm mt-1">Visibilidad humana y contexto técnico sobre conexiones salientes</p>
      </div>
      <button id="scan-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-md shadow flex items-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4"></path>
          <path d="M12 8h.01"></path>
        </svg>
        Scan Now
      </button>
    </header>
    
    <main id="app-content">
      <div id="welcome-message" class="text-center py-12 text-gray-500">
        <p>Haz clic en "Scan Now" para analizar las conexiones salientes activas.</p>
      </div>
    </main>
  </div>
</body>
</html>
