name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, attest & publish release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Validate version and release policy
        shell: pwsh
        run: |
          .\scripts\validate-release.ps1 -Tag "${{ github.ref_name }}"
          .\scripts\test-release-pipeline.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build and bundle application
        shell: pwsh
        run: |
          npx tauri build --ci
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri build fallo con exit code $LASTEXITCODE."
          }

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/app.exe release-artifacts/out-cxns-monitor.exe
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-artifacts/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/
          $artifacts = @(Get-ChildItem release-artifacts -File)
          if ($artifacts.Count -ne 3) {
            throw "Se esperaban 3 binarios de release y se encontraron $($artifacts.Count)."
          }

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: .\scripts\generate-checksums.ps1 -Directory release-artifacts

      - name: Attest release artifacts and SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release-artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 🌐 [ocm.apwebai.es](https://ocm.apwebai.es/) — web oficial del proyecto

            **Outbound Connections Monitor (OCM) ${{ github.ref_name }}** es un analizador local y bajo demanda de conexiones salientes para Windows: collector nativo, identidad SHA-256, firma Authenticode de los binarios observados, linaje de procesos, baseline, afinidad, riesgo explicable y panel de completitud de evidencia.

            ### 📦 Instalación

            - `*-setup.exe` (NSIS) — recomendado para usuarios finales.
            - `*.msi` (WiX) — despliegue corporativo (GPO/Intune).
            - `out-cxns-monitor.exe` — ejecutable autónomo para verificación técnica.
            - `checksums.txt` — SHA-256 de todos los artefactos.
            - `sbom.spdx.json` — inventario SPDX de componentes.

            Requisitos: Windows 10 o superior. Si falta el runtime WebView2, el instalador lo descarga automáticamente.

            ### 🔐 Integridad, procedencia y aviso de firma

            Los binarios de esta release no están firmados con Authenticode. Windows puede mostrar `Editor desconocido` o una advertencia de SmartScreen. Descarga OCM únicamente desde esta release oficial y verifica los hashes SHA-256 de `checksums.txt` y la attestation de procedencia de GitHub antes de ejecutarlo.

            El workflow construye desde el tag publicado, ejecuta los gates de calidad, genera checksums y SBOM, y vincula todos los artefactos al commit y al workflow mediante GitHub artifact attestations.
          files: |
            release-artifacts/*
