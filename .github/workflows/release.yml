name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, sign, attest & publish release
    runs-on: windows-2022
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Validate version and signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: .\scripts\validate-release.ps1 -Tag "${{ github.ref_name }}" -RequireSigningConfiguration

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Authenticate to Azure with OIDC
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Artifact Signing client
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $version = "1.0.128"
          $expectedSha256 = "74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b"
          $archive = Join-Path $env:RUNNER_TEMP "artifact-signing-client-$version.zip"
          $client = Join-Path $env:RUNNER_TEMP "artifact-signing-client-$version"
          $uri = "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Artifact Signing client SHA-256 mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $client
          $dlib = Join-Path $client "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) {
            throw "Azure.CodeSigning.Dlib.dll no encontrado."
          }
          $metadata = Join-Path $env:RUNNER_TEMP "artifact-signing-metadata.json"
          @{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE
            CorrelationId = $env:GITHUB_RUN_ID
            ExcludeCredentials = @(
              "EnvironmentCredential",
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $metadata -Encoding utf8
          "ARTIFACT_SIGNING_DLIB_PATH=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_SIGNING_METADATA_PATH=$metadata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, sign and bundle application
        shell: pwsh
        run: |
          $signScript = (Resolve-Path ".\scripts\sign-artifact.ps1").Path
          $signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$signScript`" %1"
          $config = @{
            bundle = @{
              windows = @{
                signCommand = $signCommand
              }
            }
          } | ConvertTo-Json -Depth 4 -Compress
          npx tauri build --ci --config $config
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri build fallo con exit code $LASTEXITCODE."
          }

      - name: Prepare and verify release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/app.exe release-artifacts/out-cxns-monitor.exe
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-artifacts/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-artifacts/
          $signed = Get-ChildItem release-artifacts -File | Select-Object -ExpandProperty FullName
          .\scripts\verify-signatures.ps1 -Paths $signed

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: .\scripts\generate-checksums.ps1 -Directory release-artifacts

      - name: Attest release artifacts and SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: release-artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 🌐 [ocm.apwebai.es](https://ocm.apwebai.es/) — web oficial del proyecto

            **Outbound Connections Monitor (OCM) ${{ github.ref_name }}** es un analizador local y bajo demanda de conexiones salientes para Windows: collector nativo, identidad SHA-256, firma Authenticode, linaje de procesos, baseline, afinidad, riesgo explicable y panel de completitud de evidencia.

            ### 📦 Instalación

            - `*-setup.exe` (NSIS) — recomendado para usuarios finales.
            - `*.msi` (WiX) — despliegue corporativo (GPO/Intune).
            - `out-cxns-monitor.exe` — ejecutable autónomo para verificación técnica.
            - `checksums.txt` — SHA-256 de todos los artefactos.
            - `sbom.spdx.json` — inventario SPDX de componentes.

            Requisitos: Windows 10 o superior. Si falta el runtime WebView2, el instalador lo descarga automáticamente.

            ### 🔐 Integridad y procedencia

            El ejecutable, MSI y NSIS están firmados mediante Microsoft Artifact Signing y timestamp RFC 3161. El workflow verifica cada firma antes de publicar, genera checksums, SBOM y una attestation de procedencia vinculada al commit y al workflow.
          files: |
            release-artifacts/*
