name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Validate synchronized versions and repository policies
        shell: pwsh
        run: |
          .\scripts\validate-release.ps1
          .\scripts\test-release-pipeline.ps1
          .\scripts\test-github-hardening.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build Tailwind CSS
        run: npm run build

      - name: Rust cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked
