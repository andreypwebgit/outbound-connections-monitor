[package]
name = "app"
version = "1.0.1"
description = "Outbound Connections Monitor: escaneo manual de conexiones salientes con baseline, afinidad y riesgo explicable"
authors = ["APWebAI"]
license = "MIT"
repository = "https://github.com/andreypwebgit/outbound-connections-monitor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
dns-lookup = "2.0"
